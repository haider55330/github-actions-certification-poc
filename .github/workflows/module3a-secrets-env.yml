name: Module 3A - Secrets and Env Vars

on:
  workflow_dispatch:

env:
  GLOBAL_ENV: "Production Server"

jobs:
  env-secrets-job:
    runs-on: ubuntu-latest
    env:
      JOB_ENV: "Port 8080"
    steps:
      - name: Print Variables and Secret
        env:
          SECRET_VAL: ${{ secrets.MY_API_SECRET }}
        run: |
          echo "Global Environment: $GLOBAL_ENV"
          echo "Job Environment: $JOB_ENV"
          echo "Secret Value: $SECRET_VAL"
