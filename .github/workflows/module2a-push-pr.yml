name: Module 2A - Push and PR Triggers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  trigger-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Trigger Event
        run: |
          echo "Workflow triggered by event: ${{ github.event_name }}"
